name: ci

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # cachix/install-nix-action v31.11.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check
      - run: nix develop -c just direct-capture-preflight
      - run: nix develop -c just check
      - run: nix develop -c just test
      - run: nix develop -c just security

  macos:
    name: macos
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # jdx/mise-action v4.3.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      - run: rustup component add rustfmt clippy
      - name: Remove hosted CI runner aws/tap
        run: |
          HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew untap aws/tap || true
      - run: brew install jq swiftformat swiftlint
      - run: just macos-check
